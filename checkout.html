<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MORVEX – Checkout</title>
    <meta name="description" content="MORVEX – premium fashion and lifestyle brand.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { serif: ["Cormorant Garamond", "serif"], sans: ["Jost", "sans-serif"] } } } }</script>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>

<body>
    <div id="site-header"></div>
    <section class="hero !items-start"><img src="assets/w4.jpg" alt=""
            class="bg w-full h-full object-cover opacity-25 blur-2xl scale-125">
        <div class="bg bg-[#141211]/70"></div>
        <div class="wrap relative max-w-5xl py-10">
            <div class="flex justify-center gap-10 text-xs mb-8 rise" id="steps"></div>
            <div id="co" class="grid md:grid-cols-[1fr_380px] gap-8 rise d1">
                <form id="f" class="glass gcard !p-7 grid gap-4" novalidate>
                    <h1 class="font-serif text-4xl">Shipping Address</h1>
                    <input name="n" class="field" placeholder="Full Name"><input name="a" class="field"
                        placeholder="Address">
                    <div class="grid grid-cols-2 gap-4"><input name="c" class="field" placeholder="City"><input name="z"
                            class="field" placeholder="Pincode"></div><input name="p" class="field"
                        placeholder="Mobile number">
                    <h2 class="font-serif text-3xl mt-2">Payment</h2>
                    <div class="grid sm:grid-cols-3 gap-3 text-sm"><label
                            class="glass rounded-2xl p-3 flex gap-2 cursor-pointer"><input type="radio" name="pm"
                                checked class="accent-[#B99A72]">UPI</label><label
                            class="glass rounded-2xl p-3 flex gap-2 cursor-pointer"><input type="radio" name="pm"
                                class="accent-[#B99A72]">Card</label><label
                            class="glass rounded-2xl p-3 flex gap-2 cursor-pointer"><input type="radio" name="pm"
                                class="accent-[#B99A72]">Cash on Delivery</label></div>
                    <label class="flex gap-2 text-xs text-white/60"><input type="checkbox" checked
                            class="accent-[#B99A72]"> Use same address for billing</label>
                    <p id="er" class="text-xs text-red-300"></p><button class="btn btn-p">Place Order →</button>
                </form>
                <aside class="glass gcard h-fit">
                    <h2 class="font-serif text-3xl mb-3">Order Summary</h2>
                    <div id="sum" class="space-y-3 text-sm"></div>
                    <div class="flex justify-between mt-4 text-sm"><span>Shipping</span><span id="sh"></span></div>
                    <div class="flex justify-between font-semibold border-t border-white/20 mt-3 pt-3 text-lg">
                        <span>Total</span><span id="t"></span></div>
                </aside>
            </div>
            <div id="ok" class="hidden glass gcard text-center py-12 max-w-xl mx-auto"><i data-lucide="check-circle-2"
                    class="w-14 h-14 mx-auto gold"></i>
                <h2 class="font-serif text-4xl mt-3">Order placed</h2>
                <p class="mt-2 text-sm text-white/65">Thank you for shopping with MORVEX. Your order number is <b
                        id="oid"></b>.</p>
                <p class="mt-3 text-xs text-white/55">Your order details were sent to our WhatsApp. If it did not open,
                    <a id="wa" class="underline gold" target="_blank" rel="noopener" href="#">tap here to send it</a>.
                </p><a href="index.html" class="btn btn-p mt-6">Back to Home</a>
            </div>
        </div>
    </section>
    <div id="site-footer"></div>
    <script src="js/components.js?v=8"></script>
    <script src="js/main.js?v=8"></script>
    <script>
        const rows = getCart().map(i => ({ ...PRODUCTS.find(p => p.id == i.id), qty: i.qty })), sub = rows.reduce((a, x) => a + x.price * x.qty, 0), shp = sub && sub < 1999 ? 99 : 0;
        steps.innerHTML = ["Address", "Payment", "Review"].map((s, i) => '<span class="text-center ' + (i ? "opacity-60" : "") + '"><b class="opt on w-8 h-8 mx-auto mb-1 ' + (i ? "!bg-none !bg-white/10 !text-[#F4EEE6]" : "") + '">' + (i + 1) + '</b>' + s + '</span>').join("");
        sum.innerHTML = rows.map(x => `<div class="flex gap-3 items-center"><div class="fitw w-12 aspect-[2/3] rounded-lg">${fit(x.img)}</div><span class="flex-1">${x.name}<br><small class="text-white/55">Qty ${x.qty}</small></span><b>${money(x.price * x.qty)}</b></div>`).join("") || '<p class="text-white/60">Your bag is empty. <a class="underline gold" href="collections.html">Shop now</a></p>';
        sh.textContent = shp ? money(shp) : "Free"; t.textContent = money(sub + shp);
        f.onsubmit = e => {
            e.preventDefault(); const v = f.elements; if (!rows.length) { er.textContent = "Your bag is empty."; return }
            if (!v.n.value.trim() || v.a.value.trim().length < 5 || !v.c.value.trim() || !/^\d{6}$/.test(v.z.value.trim()) || !/^[6-9]\d{9}$/.test(v.p.value.trim())) { er.textContent = "Please fill all fields correctly (6-digit pincode, 10-digit mobile)."; return }
            const id = "MVX" + Date.now().toString().slice(-7), pm = f.querySelector("input[name=pm]:checked").parentElement.textContent.trim();
            const msg = "*New MORVEX Order* #" + id + "\n\n*Customer:* " + v.n.value.trim() + "\n*Mobile:* " + v.p.value.trim() + "\n*Address:* " + v.a.value.trim() + ", " + v.c.value.trim() + " - " + v.z.value.trim() + "\n*Payment:* " + pm + "\n\n*Items:*\n" + rows.map((x, i) => (i + 1) + ". " + x.name + " x" + x.qty + " - " + money(x.price * x.qty)).join("\n") + "\n\nSubtotal: " + money(sub) + "\nShipping: " + (shp ? money(shp) : "Free") + "\n*Total: " + money(sub + shp) + "*";
            setCart([]); co.classList.add("hidden"); ok.classList.remove("hidden"); oid.textContent = id; lucide.createIcons(); sendWA(msg, wa)
        };
    </script>
</body>

</html>
